[project]
name = "bracket-ranker"
version = "0.1.0"
description = "Commander Bracket 'Feel' Ranker"
requires-python = ">=3.11"

[project.scripts]
rank = "rank:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["rank", "run_ingest", "run_analyze", "run_calibrate", "run_export"]
packages = ["bracket_ranker"]
